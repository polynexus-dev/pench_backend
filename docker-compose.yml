services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=delivery_erp_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_erp_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:9083
    ports:
      - "9083:9083"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-key-change-in-prod}
      - DEBUG=1
      - HAS_GDAL=True                              # GDAL is installed in this image
      - DB_NAME=delivery_erp_dev
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=.pench.api.polynexus.in,.pench.dev.api.polynexus.in,13.235.143.251,localhost,127.0.0.1,.localhost
      - CORS_ALLOW_ALL_ORIGINS=True
      - RUN_MIGRATIONS=1
      - PUBLIC_DOMAIN=pench.api.polynexus.in
      - GDAL_LIBRARY_PATH=                         # Let Django auto-detect on Linux
      - GEOS_LIBRARY_PATH=
    volumes:
      - .:/app
      - media_data:/app/media                      # Persist uploaded media across restarts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: celery -A config worker -l info
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-key-change-in-prod}
      - HAS_GDAL=True
      - DB_NAME=delivery_erp_dev
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GDAL_LIBRARY_PATH=
      - GEOS_LIBRARY_PATH=
      - WAIT_FOR_READY=1                          # Wait for web migrations before starting
    volumes:
      - .:/app
      - media_data:/app/media                     # Shared volume to detect ready-file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f /app/beat/celerybeat.pid && celery -A config beat -l info --scheduler=django_celery_beat.schedulers:DatabaseScheduler --schedule=/app/beat/celerybeat-schedule --pidfile=/app/beat/celerybeat.pid"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-dev-key-change-in-prod}
      - HAS_GDAL=True
      - DB_NAME=delivery_erp_dev
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - GDAL_LIBRARY_PATH=
      - GEOS_LIBRARY_PATH=
      - WAIT_FOR_READY=1                          # Wait for web migrations before starting
    volumes:
      - .:/app
      - beat_data:/app/beat                       # Persist celerybeat-schedule file
      - media_data:/app/media                     # Shared volume to detect ready-file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  media_data:
  beat_data: