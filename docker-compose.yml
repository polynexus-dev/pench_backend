version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=delivery_erp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build: .
    environment:
      - RUN_MIGRATIONS=1
      - DB_NAME=delivery_erp
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_HOST=db
      - DB_PORT=5432
    command: ["echo", "Migrations completed"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8083 config.asgi:application
    ports:
      - "8083:8083"
    environment:
      - DEBUG=1
      - DB_NAME=delivery_erp
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - RUN_MIGRATIONS=0
      - PUBLIC_DOMAIN=192.168.1.195.nip.io
      - ALLOWED_HOSTS=.192.168.1.195.nip.io,.13.235.143.251,localhost,127.0.0.1
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker -l info
    environment:
      - DB_NAME=delivery_erp
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat -l info
    environment:
      - DB_NAME=delivery_erp
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
