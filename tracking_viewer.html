<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pench | Live Tracking Dashboard</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .dot.connected {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        main {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Login Overlay */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.3s ease;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-dark);
        }

        #log-container {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            width: 300px;
            max-height: 200px;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 0.75rem;
            padding: 1rem;
            font-size: 0.75rem;
            overflow-y: auto;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .log-entry {
            margin-bottom: 0.25rem;
            border-left: 2px solid var(--primary);
            padding-left: 0.5rem;
        }

        .leaflet-container {
            background: #0f172a !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PENCH TRACKING</div>
        <div class="status">
            <span id="status-dot" class="dot"></span>
            <span id="status-text">Disconnected</span>
        </div>
    </header>

    <div id="login-overlay">
        <div class="login-card">
            <h2>Admin Access</h2>
            <div class="input-group">
                <label>Host</label>
                <input type="text" id="host" value="pune.localhost:8083">
                <p id="host-warning" style="color: #f59e0b; font-size: 0.7rem; margin-top: 0.25rem; display: none;">⚠️ Warning: Using 'localhost' will connect to the Public schema (which has no tracking tables). Use 'pune.localhost' or '127.0.0.1' instead.</p>
            </div>
            <div class="input-group">
                <label>Username (Staff)</label>
                <input type="text" id="username" placeholder="9823000000">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button id="login-btn">Start Tracking</button>
            <p id="login-error" style="color: #ef4444; font-size: 0.75rem; margin-top: 1rem; text-align: center; display: none;"></p>
        </div>
    </div>

    <main>
        <div id="map"></div>
        <div id="log-container"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        let map, markers = {}, trails = {};
        let ws;

        // Initialize Map
        function initMap() {
            map = L.map('map', {
                zoomControl: false
            }).setView([18.5204, 73.8567], 13); // Default Pune

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            L.control.zoom({
                position: 'topright'
            }).addTo(map);
        }

        initMap();

        function addLog(msg) {
            const container = document.getElementById('log-container');
            container.style.display = 'block';
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            container.prepend(div);
        }

        async function login() {
            const host = document.getElementById('host').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = 'Authenticating...';
            errorEl.style.display = 'none';

            try {
                const response = await fetch(`http://${host}/api/accounts/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) throw new Error('Login failed. Ensure user is staff.');

                const data = await response.json();
                const token = data.access;

                document.getElementById('login-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = 'none';
                }, 300);

                connectWebSocket(host, token);
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Start Tracking';
            }
        }

        function connectWebSocket(host, token) {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const wsUrl = `${wsProtocol}://${host}/ws/tracking/?token=${token}`;

            addLog(`Connecting to ${wsUrl}...`);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('status-dot').className = 'dot connected';
                document.getElementById('status-text').textContent = 'Live Connected';
                addLog('WebSocket Connected!');
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'broadcast_location') {
                    updateDriverOnMap(data);
                }
            };

            ws.onclose = () => {
                document.getElementById('status-dot').className = 'dot';
                document.getElementById('status-text').textContent = 'Disconnected';
                addLog('WebSocket Closed. Retrying in 5s...');
                setTimeout(() => connectWebSocket(host, token), 5000);
            };
        }

        function updateDriverOnMap(data) {
            const { driver_id, driver_name, lat, lng, trail } = data;
            const pos = [lat, lng];

            addLog(`Update: ${driver_name} moved to ${lat}, ${lng}`);

            // Update Marker
            if (!markers[driver_id]) {
                markers[driver_id] = L.marker(pos).addTo(map)
                    .bindPopup(`<b>${driver_name}</b><br>ID: ${driver_id}`)
                    .openPopup();
                
                // Adjust map view to first driver
                map.panTo(pos);
            } else {
                markers[driver_id].setLatLng(pos);
            }

            // Update Trail
            if (trail && trail.length > 0) {
                // GeoJSON uses [lng, lat], Leaflet uses [lat, lng]
                const latLngs = trail.map(p => [p[1], p[0]]);
                
                if (!trails[driver_id]) {
                    trails[driver_id] = L.polyline(latLngs, {
                        color: '#6366f1',
                        weight: 3,
                        opacity: 0.6,
                        dashArray: '5, 10'
                    }).addTo(map);
                } else {
                    trails[driver_id].setLatLngs(latLngs);
                }
            }
        }

        document.getElementById('host').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const warning = document.getElementById('host-warning');
            if (val.startsWith('localhost')) {
                warning.style.display = 'block';
            } else {
                warning.style.display = 'none';
            }
        });

        document.getElementById('login-btn').addEventListener('click', login);
    </script>
</body>
</html>
